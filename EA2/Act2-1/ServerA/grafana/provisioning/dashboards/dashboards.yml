# Provisioning de dashboards: cualquier archivo .json que los alumnos dejen en
# ServerA/grafana/dashboards se carga automaticamente al levantar Grafana.
apiVersion: 1

providers:
  - name: "default"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
