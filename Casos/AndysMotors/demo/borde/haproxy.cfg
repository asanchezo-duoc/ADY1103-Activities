# HAProxy: puerta de entrada unica a la plataforma de Andys Motors.
#
# Todo el trafico de clientes y vendedores entra por aqui y se reparte hacia las
# plataformas internas. Los backends no necesitan exponerse a Internet.
#
# Las direcciones de los backends se leen de variables de entorno, para que el
# mismo archivo sirva con todos los servicios en una maquina o repartidos en
# seis servidores distintos.

global
    log stdout format raw local0 info

# DNS en caliente. Sin esto HAProxy resuelve los nombres UNA sola vez, al
# arrancar, y aborta si alguno no resuelve todavia. En un despliegue repartido
# en varios servidores eso significa que el borde no levanta si una plataforma
# va atrasada.
resolvers dns
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s
    hold nx    5s
    hold other 5s

defaults
    mode http
    log global
    option httplog
    # Sin timeouts explicitos HAProxy no arranca. Ademas son la primera linea de
    # defensa: una dependencia colgada no deja conexiones abiertas para siempre.
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    # Reintenta una vez si el backend no acepta la conexion.
    retries 2

# ---------------------------------------------------------------------------
# Entrada publica
# ---------------------------------------------------------------------------
frontend publico
    bind *:80

    # Se conserva el identificador de peticion si viene, y si no se genera uno.
    # Asi una misma transaccion se puede seguir desde el borde hasta la base de
    # datos, porque todos los servicios registran el mismo id en sus logs.
    http-request set-var(txn.rid) req.hdr(X-Request-Id)
    http-request set-var(txn.rid) uuid() unless { req.hdr(X-Request-Id) -m found }
    http-request set-header X-Request-Id %[var(txn.rid)]

    # Enrutamiento por prefijo de ruta, siguiendo los canales del diagrama.
    use_backend bk_stock   if { path_beg /stock }
    use_backend bk_agenda  if { path_beg /agenda }
    use_backend bk_crm     if { path_beg /crm }
    use_backend bk_pagos   if { path_beg /pagos }
    default_backend bk_web

# ---------------------------------------------------------------------------
# Backends: una plataforma del caso por backend
# ---------------------------------------------------------------------------
backend bk_web
    option httpchk GET /health
    server web1 "${WEB_HOST}:${WEB_PORT}" check inter 5s resolvers dns init-addr last,libc,none

backend bk_stock
    option httpchk GET /health
    http-request replace-path /stock/?(.*) /\1
    server stock1 "${STOCK_HOST}:${STOCK_PORT}" check inter 5s resolvers dns init-addr last,libc,none

backend bk_agenda
    option httpchk GET /health
    http-request replace-path /agenda/?(.*) /\1
    server agenda1 "${AGENDA_HOST}:${AGENDA_PORT}" check inter 5s resolvers dns init-addr last,libc,none

backend bk_crm
    option httpchk GET /health
    http-request replace-path /crm/?(.*) /\1
    server crm1 "${CRM_HOST}:${CRM_PORT}" check inter 5s resolvers dns init-addr last,libc,none

backend bk_pagos
    option httpchk GET /health
    http-request replace-path /pagos/?(.*) /\1
    server pagos1 "${PAGOS_HOST}:${PAGOS_PORT}" check inter 5s resolvers dns init-addr last,libc,none

# ---------------------------------------------------------------------------
# Observabilidad del borde
#
# HAProxy 2.0 en adelante trae el exporter de Prometheus INTEGRADO: no hace
# falta ningun sidecar. Estas tres lineas publican mas de 200 familias de
# metricas, entre ellas el estado de cada backend y el desglose de respuestas
# por codigo HTTP.
#
# Ojo con una limitacion importante: haproxy_backend_response_time_average_seconds
# es un PROMEDIO de las ultimas 1024 conexiones, no un histograma. Para calcular
# un percentil 95 hay que usar los histogramas que exponen las propias APIs.
# ---------------------------------------------------------------------------
frontend observabilidad
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
