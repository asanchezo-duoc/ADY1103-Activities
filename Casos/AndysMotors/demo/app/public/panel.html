<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Andys Motors · Plataforma interna</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;600;700;800&display=swap');
    :root{--ink:#17211d;--cream:#f3f0e8;--lime:#d9f36b;--orange:#ff7048;--muted:#778078;--line:#d5d9cf}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Manrope,sans-serif}
    header{background:var(--ink);color:var(--cream);padding:24px 6vw;display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:-.06em}.pill,.eyebrow,.number{font:500 .7rem 'DM Mono';text-transform:uppercase}.pill{color:var(--lime)}main{max-width:1250px;margin:auto;padding:55px 6vw}.eyebrow{color:var(--orange);letter-spacing:.12em}h1{font-size:clamp(2.5rem,6vw,5.5rem);line-height:.9;letter-spacing:-.08em;margin:16px 0 45px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:#fff;border:1px solid var(--line);padding:25px}.card h2{margin:0 0 20px;letter-spacing:-.05em}form{display:grid;gap:10px}input,button{font:inherit;padding:12px;border:1px solid var(--line);background:var(--cream)}button{background:var(--ink);color:white;border:0;font-weight:700;cursor:pointer}button:hover{background:var(--orange)}table{border-collapse:collapse;width:100%;font-size:.85rem}td{border-bottom:1px solid var(--line);padding:12px 6px}.number{color:var(--orange)}.status{font:500 .72rem 'DM Mono';min-height:20px;color:var(--muted)}.ok{color:#37834d}.error{color:#bd3c2d}.nav{display:flex;gap:15px;margin-bottom:25px}.nav a{color:var(--ink);font:500 .7rem 'DM Mono';text-decoration:none;border-bottom:1px solid var(--ink)}@media(max-width:800px){.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="brand">ANDYS MOTORS</div><div class="pill" id="rol">PLATAFORMA INTERNA</div></header>
  <main><div class="eyebrow">OPERACIONES / <span id="servicio"></span></div><h1 id="titulo"></h1><div class="nav"><a href="/">Inicio</a><a href="/metrics">Métricas</a><a href="/health">Health</a></div><div class="layout"><section class="card" id="contenido"></section><section class="card"><h2>Actividad reciente</h2><div id="tabla">Cargando...</div></section></div></main>
  <script>
    const port=location.port||'80';
    const cfg={8082:{name:'Stock',title:'Todo listo para vender.',load:'/api/stock',label:'vehículos'},8083:{name:'Agenda',title:'Las visitas empiezan aquí.',load:'/api/agendamientos',label:'visitas'},8084:{name:'CRM',title:'Cada cliente cuenta.',load:'/api/oportunidades',label:'oportunidades'},8085:{name:'Pagos',title:'Cierra la venta con confianza.',load:'/api/pagos',label:'transacciones'}}[port]||{name:'Plataforma',title:'Operación Andys Motors.',load:'/health',label:'registros'};
    document.querySelector('#servicio').textContent=cfg.name;document.querySelector('#rol').textContent=cfg.name+' / EQUIPO INTERNO';document.querySelector('#titulo').textContent=cfg.title;
    const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0);
    function formulario(){if(port==='8082')return '<h2>Consultar inventario</h2><p>Disponibilidad por sucursal, en tiempo real.</p><button onclick="cargar()">Actualizar stock ↗</button>';if(port==='8083')return '<h2>Nueva visita</h2><form onsubmit="crear(event,\'/api/agendamientos\')"><input name="cliente_nombre" placeholder="Nombre del cliente" required><input name="sucursal" placeholder="Sucursal" value="Santiago Centro"><input name="fecha_visita" type="date" required><button>Confirmar visita</button><div class="status" id="estado"></div></form>';if(port==='8084')return '<h2>Nuevo cliente</h2><form onsubmit="crearCliente(event)"><input name="nombre" placeholder="Nombre completo" required><input name="email" type="email" placeholder="Correo"><input name="telefono" placeholder="Teléfono"><button>Registrar en CRM</button><div class="status" id="estado"></div></form>';if(port==='8085')return '<h2>Procesar pago</h2><form onsubmit="crear(event,\'/api/pagos\')"><input name="oportunidad_id" type="number" placeholder="ID oportunidad"><input name="monto_clp" type="number" placeholder="Monto CLP" required><button>Enviar a autorización</button><div class="status" id="estado"></div></form>';return '<h2>Panel operativo</h2>'}
    document.querySelector('#contenido').innerHTML=formulario();
    async function cargar(){try{const d=await (await fetch(cfg.load)).json();const rows=d.vehiculos||d.agendamientos||d.oportunidades||d.pagos||[];document.querySelector('#tabla').innerHTML='<div class="number">'+rows.length+' '+cfg.label+'</div><table>'+rows.slice(0,12).map((x,i)=>'<tr><td class="number">'+String(i+1).padStart(2,'0')+'</td><td>'+texto(x)+'</td></tr>').join('')+'</table>'}catch(e){document.querySelector('#tabla').innerHTML='<span class="error">No se pudo cargar la información.</span>'}}
    function texto(x){if(port==='8082')return x.marca+' '+x.modelo+' · '+money(x.precio_clp)+'<br><small>'+x.sucursal+'</small>';if(port==='8083')return x.cliente_nombre+'<br><small>'+x.fecha_visita+' · '+x.sucursal+'</small>';if(port==='8084')return (x.cliente||'Sin cliente')+'<br><small>Etapa: '+x.etapa+' · '+money(x.monto_clp)+'</small>';return x.estado+'<br><small>'+money(x.monto_clp)+'</small>'}
    async function crear(e,url){e.preventDefault();const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();document.querySelector('#estado').textContent=r.ok?'Operación registrada correctamente.':d.error||'No se pudo completar';document.querySelector('#estado').className='status '+(r.ok?'ok':'error');if(r.ok){e.target.reset();cargar()}}
    async function crearCliente(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.origen='crm_interno';const r=await fetch('/api/clientes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});document.querySelector('#estado').textContent=r.ok?'Cliente registrado correctamente.':'No se pudo registrar el cliente';document.querySelector('#estado').className='status '+(r.ok?'ok':'error');if(r.ok){e.target.reset();cargar()}}
    cargar();
  </script>
</body></html>
